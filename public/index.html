<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dina — Ton cercle. Ton moment.</title><link rel="stylesheet" href="/style.css"></head><body>
<div id="auth" class="auth"><div class="brand"><span>D</span><b>Dina</b></div><p class="tag">Ton cercle. Ton moment.</p><div class="card"><div class="tabs"><button class="active" data-tab="login">Connexion</button><button data-tab="register">Créer un compte</button></div><form id="login" class="form"><input name="username" placeholder="Nom d’utilisateur" required><input name="password" type="password" placeholder="Mot de passe" required><button>Se connecter</button></form><form id="register" class="form hidden"><input name="username" placeholder="Nom d’utilisateur" required><input name="password" type="password" placeholder="Mot de passe (6 caractères min.)" required><button>Créer mon compte</button></form><p id="authMsg" class="msg"></p></div></div>
